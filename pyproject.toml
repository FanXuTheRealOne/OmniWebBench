[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "omniwebbench"
version = "0.2.0"
description = "A capability-first, evidence-grounded benchmark for general-purpose web agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OmniWebBench contributors" }]
keywords = ["web-agent", "benchmark", "browser-automation", "ai-agents", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "pytest>=8.0", "ruff>=0.9"]

[project.scripts]
omniwebbench = "omniwebbench.cli:main"

[project.urls]
Homepage = "https://github.com/FanXuTheRealOne/OmniWebBench"
Repository = "https://github.com/FanXuTheRealOne/OmniWebBench"
Issues = "https://github.com/FanXuTheRealOne/OmniWebBench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omniwebbench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]
